[package]
name = "statime"
description = "Precision Time Protocol implementation library: statime 0.4.0 with PTP v1 (IEEE 1588-2002): the follower from Inferno's fork, a leader by IDN (see README-IDN.md)"
authors = [
    "David Venhoek <david@tweedegolf.com>",
    "Folkert de Vries <folkert@tweedegolf.com>",
    "Dion Dokter <dion@tweedegolf.com>",
    "Ruben Nijveld <ruben@tweedegolf.com>",
    "Teodor Woźniak <teodly@lumifaza.org>",
]
version = "0.4.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/teodly/statime"
# Never published to crates.io.
publish = false

[features]
default = ["std", "serde"]
std = []
fuzz = ["std"]
serde = ["dep:serde", "arrayvec/serde"]

[dependencies]
arrayvec = { version = "0.7.4", default-features = false }
az = "1.2.1"
fixed = "1.24"
hex = "0.4.3"
libm = "0.2.8"
log = { version = "0.4.20", default-features = false }
rand = { version = "0.8.5", default-features = false }
serde = { version = "1.0.192", features = ["derive"], optional = true }

# The fork's v1 code leaves unused items and older lifetime spellings: kept as they are
# (fewer differences from it), their warnings off here (IDN change 3, README-IDN.md).
[lints.rust]
unused = "allow"
mismatched_lifetime_syntaxes = "allow"

[dev-dependencies]
serde_test = "1.0.176"
# The Port example in src/port/mod.rs uses rand::thread_rng (statime's own workspace
# gave rand its std features; IDN change 1, README-IDN.md).
rand = { version = "0.8.5", features = ["std", "std_rng"] }
