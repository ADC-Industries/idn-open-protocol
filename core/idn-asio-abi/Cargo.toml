[package]
name = "idn-asio-abi"
description = "The ASIO driver interface (types, the driver's vtable, finding and loading drivers on Windows and Linux), written from cwASIO's public headers; no Steinberg SDK"
license = "MIT OR Apache-2.0"
authors = ["ADC Industries"]
version = "0.3.8"
edition = "2024"
# Never published to crates.io.
publish = false

[dependencies]
# The shared helpers (registry reads, locks, switches); light, and every user of this
# crate has it already.
idn-common = { path = "../idn-common" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_System_Registry", "Win32_System_Com",
    # (RegCreateKeyExW takes SECURITY_ATTRIBUTES: windows-sys gates it on this.)
    "Win32_Security",
] }

# Linux: cwASIO's way (dlopen, the /etc/cwASIO list's file modes and error numbers). The
# version the workspace already uses.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"
