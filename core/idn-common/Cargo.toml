[package]
name = "idn-common"
version = "0.3.8"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Small pieces every IDN program shares: saving files safely, the state folder, real-time threads, HTML escaping, running and restarting helper programs"
publish = false

[dependencies]
libc = "0.2.191"
# Saved JSON files read back (`fsutil::load_json`): the versions the workspace already has.
serde = "1"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Performance", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_Devices_DeviceAndDriverInstallation", "Win32_System_Threading", "Win32_System_Console", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }
