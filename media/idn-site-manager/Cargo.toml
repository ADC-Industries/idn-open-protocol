[package]
name = "idn-site-manager"
description = "IDN Site Manager: the site's central panel and its updates, run by idn-discovery-server beside the site authority (spec/extensions/idn-node.md §N.11.1)"
license = "MIT OR Apache-2.0"
authors = ["ADC Industries"]
version = "0.3.8"
edition = "2024"
# Never published to crates.io.
publish = false

# The Site Manager on its own (a server, a VPS, a container), as `idn discovery-server`.
[[bin]]
name = "idn-site-manager"
path = "src/bin/idn-site-manager.rs"
test = false

[dependencies]
serde = { version = "1", features = ["derive"] }
# The typed commands' JSON schema (GET /api/v1/schema).
schemars = "1"
idn-open-protocol = { path = "../../core/idn-open-protocol" }
idn-common = { path = "../../core/idn-common" }
# The site's MQTT broker (§N.33).
idn-mqtt = { path = "../../core/idn-mqtt" }
# IDN Voice beside the panel (idn-voice.md): the `voice` feature (on by default). Off, the
# Site Manager builds without it and its WebRTC stack (str0m, rcgen, aws-lc-sys and the
# cmake it needs).
idn-voice = { path = "../../core/idn-voice", optional = true }
axum = { version = "0.8", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
serde_json = "1"

[features]
default = ["voice"]
voice = ["dep:idn-voice"]

[dev-dependencies]
# The push channel's test: a WebSocket over TLS, logged in.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
idn-open-protocol = { path = "../../core/idn-open-protocol", features = ["http-client"] }
rumqttc = { version = "0.25", default-features = false }
