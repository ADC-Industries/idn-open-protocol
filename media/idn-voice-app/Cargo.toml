[package]
name = "idn-voice-app"
description = "IDN Voice on the desktop: the Voice web client in a window of its own, with a talk key or foot pedal, a tray icon and a start at log-in (spec/extensions/idn-voice.md §V.11)"
license = "MIT OR Apache-2.0"
authors = ["ADC Industries"]
version = "0.3.8"
edition = "2024"
# Never published to crates.io.
publish = false

[[bin]]
name = "idn-voice"
path = "src/main.rs"

[dependencies]
idn-common = { path = "../../core/idn-common" }
idn-open-protocol = { path = "../../core/idn-open-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
data-encoding = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading",
    "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_Com",
    "Win32_System_Registry", "Win32_UI_Input_KeyboardAndMouse",
] }
# The window (WebView2; its loader DLL is loaded at run time, shipped next to the program).
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_40"] }
gtk = "0.18"
javascriptcore-rs = "1.1"

[build-dependencies]
embed-resource = "3"
